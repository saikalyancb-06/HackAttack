<!doctype html>
<html><head><meta charset="utf-8"><title>PenMart - Online Stationery Store</title>
<style>body{font-family:Segoe UI,Arial;margin:0}header{display:flex;gap:16px;align-items:center;padding:12px 20px;background:#2874f0;color:#fff}

  <div class="card"><a href="product.html?id=red-pen" id="p_red">Red Gel Pen</a><div>₹35 · ★4.1</div></div>
  <div class="card"><a href="product.html?id=notebook" id="p_nb">A5 Notebook</a><div>₹60 · ★4.3</div></div>
</div>
<script src="shop.js"></script>
</body></html>
